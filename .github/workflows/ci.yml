name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *" # nightly: keeps the bench job running without burning minutes on every push

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROPTEST_CASES: "256"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  oracle:
    name: Java oracle differential test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-v1-${{ hashFiles('tools/oracle-dumper/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-v1-
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build sigil CLI
        run: cargo build -p sigil-cli
      - name: Build oracle dumper
        run: mvn -B compile
        working-directory: tools/oracle-dumper
      - name: Differential comparison on conformance models
        run: |
          set -euo pipefail
          shopt -s nullglob
          fixtures=(tests/oracle/*.rosetta)
          if [ "${#fixtures[@]}" -eq 0 ]; then
            echo "::error::No oracle fixtures matched tests/oracle/*.rosetta (missing files or glob typo)"
            exit 1
          fi
          for fixture in "${fixtures[@]}"; do
            echo "::group::Oracle comparison: ${fixture}"
            python3 scripts/oracle_compare.py "${fixture}"
            echo "::endgroup::"
          done
          echo "All ${#fixtures[@]} oracle fixture(s) compared successfully."

  bench:
    name: cargo bench (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    # Nightly/on-demand only: benches burn ~10 min of Actions minutes per
    # push, and private-repo minutes are the binding constraint on CI.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run benchmarks (reduced sample size)
        run: cargo bench --workspace --bench pipeline --bench reanalysis -- --sample-size 10 --warm-up-time 1 --measurement-time 2
